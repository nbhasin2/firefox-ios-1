# The configuration for the deferredRemovalFeature feature
features:
  deferred-removal-feature:
    description: >
      Controls whether migrated call sites use async/await instead of the Deferred library.
    variables:
      enabled:
        description: >
          Whether migrated call sites use async/await instead of Deferred.
        type: Boolean
        default: false
    defaults:
      - channel: beta
        value:
          enabled: false
      - channel: developer
        value:
          enabled: false
